name: Strict Design Audit Capture

on:
  push:
    branches:
      - agent/strict-design-audit-capture

jobs:
  capture-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated browser tooling
        shell: bash
        run: |
          mkdir -p /tmp/fr-audit
          cd /tmp/fr-audit
          npm init -y
          npm install playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Capture current Production surfaces
        shell: bash
        env:
          BASE_URL: https://frontier-radar-eosin.vercel.app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/strict-design-audit"
          cd /tmp/fr-audit
          node <<'NODE'
          const { chromium } = require('playwright');
          const { source: axeSource } = require('axe-core');
          const fs = require('fs');
          const path = require('path');

          const base = process.env.BASE_URL;
          const out = path.join(process.env.GITHUB_WORKSPACE, 'artifacts/strict-design-audit');
          const report = { base, capturedAt: new Date().toISOString(), pages: [] };

          function safeName(value) {
            return value.replace(/[^a-z0-9-]+/gi, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').toLowerCase();
          }

          async function makeContext(browser, viewport) {
            const context = await browser.newContext({ viewport, reducedMotion: 'reduce' });
            await context.route('**/api/feedback', (route) => route.abort('blockedbyclient'));
            return context;
          }

          async function analyze(page, name, viewport) {
            await page.addScriptTag({ content: axeSource });
            const basic = await page.evaluate(() => ({
              title: document.title,
              h1: Array.from(document.querySelectorAll('h1')).map((n) => n.textContent?.trim()).filter(Boolean),
              h2: Array.from(document.querySelectorAll('h2')).map((n) => n.textContent?.trim()).filter(Boolean).slice(0, 20),
              navText: Array.from(document.querySelectorAll('nav a, nav button')).map((n) => n.textContent?.trim()).filter(Boolean),
              links: document.querySelectorAll('a').length,
              buttons: document.querySelectorAll('button').length,
              inputs: document.querySelectorAll('input, textarea, select').length,
              bodyTextLength: document.body.innerText.length,
              scrollHeight: document.documentElement.scrollHeight,
              viewportHeight: window.innerHeight,
              interactiveWithoutName: Array.from(document.querySelectorAll('button, a, [role="button"], [role="link"]'))
                .filter((el) => {
                  const aria = el.getAttribute('aria-label') || el.getAttribute('aria-labelledby');
                  const text = (el.textContent || '').trim();
                  const title = el.getAttribute('title');
                  return !aria && !text && !title;
                }).length,
            }));
            const axe = await page.evaluate(async () => {
              const result = await axe.run(document, { runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa'] } });
              return result.violations.map((v) => ({
                id: v.id,
                impact: v.impact,
                help: v.help,
                nodes: v.nodes.slice(0, 6).map((n) => ({ target: n.target, html: n.html, failureSummary: n.failureSummary })),
              }));
            });
            const nav = await page.evaluate(() => {
              const entry = performance.getEntriesByType('navigation')[0];
              if (!entry) return null;
              return {
                domContentLoaded: Math.round(entry.domContentLoadedEventEnd),
                loadEventEnd: Math.round(entry.loadEventEnd),
                transferSize: entry.transferSize,
                encodedBodySize: entry.encodedBodySize,
                decodedBodySize: entry.decodedBodySize,
              };
            });
            report.pages.push({ name, url: page.url(), viewport, basic, axe, navigation: nav });
          }

          async function gotoStable(page, route) {
            await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(1200);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let projectId = null;

            const desktop = await makeContext(browser, { width: 1440, height: 1000 });
            const page = await desktop.newPage();

            await gotoStable(page, '/today');
            await page.screenshot({ path: path.join(out, '01-today-hero-desktop.png'), fullPage: false });
            await analyze(page, 'today-desktop', { width: 1440, height: 1000 });
            projectId = await page.locator('.motion-lab-signal[data-item-id]').first().getAttribute('data-item-id').catch(() => null);

            const scroller = page.locator('.motion-lab-scroller');
            if (await scroller.count()) {
              await scroller.evaluate((el) => { el.scrollTop = Math.max(0, (el.scrollHeight - el.clientHeight) * 0.38); });
              await page.waitForTimeout(700);
              await page.screenshot({ path: path.join(out, '02-today-signal-desktop.png'), fullPage: false });
              await scroller.evaluate((el) => { el.scrollTop = Math.max(0, (el.scrollHeight - el.clientHeight) * 0.78); });
              await page.waitForTimeout(700);
              await page.screenshot({ path: path.join(out, '03-today-late-desktop.png'), fullPage: false });
            }

            await gotoStable(page, '/explore');
            await page.screenshot({ path: path.join(out, '04-explore-desktop.png'), fullPage: true });
            await analyze(page, 'explore-desktop', { width: 1440, height: 1000 });

            if (projectId) {
              await gotoStable(page, '/project/' + encodeURIComponent(projectId));
              await page.screenshot({ path: path.join(out, '05-project-desktop.png'), fullPage: true });
              await analyze(page, 'project-desktop', { width: 1440, height: 1000 });
            }

            await gotoStable(page, '/saved');
            await page.screenshot({ path: path.join(out, '06-saved-desktop.png'), fullPage: true });
            await analyze(page, 'saved-desktop', { width: 1440, height: 1000 });

            await gotoStable(page, '/idea-lab');
            await page.screenshot({ path: path.join(out, '07-idea-lab-desktop.png'), fullPage: true });
            await analyze(page, 'idea-lab-desktop', { width: 1440, height: 1000 });
            await desktop.close();

            const mobile = await makeContext(browser, { width: 390, height: 844 });
            const mp = await mobile.newPage();
            await gotoStable(mp, '/today');
            await mp.screenshot({ path: path.join(out, '08-today-mobile.png'), fullPage: false });
            await analyze(mp, 'today-mobile', { width: 390, height: 844 });

            await gotoStable(mp, '/explore');
            await mp.screenshot({ path: path.join(out, '09-explore-mobile.png'), fullPage: true });
            await analyze(mp, 'explore-mobile', { width: 390, height: 844 });

            if (projectId) {
              await gotoStable(mp, '/project/' + encodeURIComponent(projectId));
              await mp.screenshot({ path: path.join(out, '10-project-mobile.png'), fullPage: true });
              await analyze(mp, 'project-mobile', { width: 390, height: 844 });
            }
            await mobile.close();
            await browser.close();

            fs.writeFileSync(path.join(out, 'audit-data.json'), JSON.stringify(report, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: strict-design-audit-production
          path: artifacts/strict-design-audit
          if-no-files-found: error
          retention-days: 7
