name: Gate 10 Production Project to Idea Lab QA

on:
  push:
    branches:
      - qa/gate10-production-project-idea-handoff
  workflow_dispatch:

concurrency:
  group: gate10-production-project-idea-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Gate 10 production browser check
        run: npx playwright test e2e/gate10-production-project-idea-handoff.spec.ts --reporter=line

      - name: Upload Gate 10 production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate10-production-project-idea-handoff-screenshots
          path: artifacts/gate10-production
          if-no-files-found: warn
          retention-days: 7
