name: Gate 14A Explore Preview Capture

on:
  push:
    branches:
      - agent/strict-design-audit-capture

jobs:
  capture-explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright
        run: |
          mkdir -p /tmp/fr-g14a
          cd /tmp/fr-g14a
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture Explore preview
        env:
          BASE_URL: https://frontier-radar-git-ag-6ee0ab-barbaralazarev08182-3355s-projects.vercel.app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/gate-14a"
          cd /tmp/fr-g14a
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, reducedMotion: 'reduce' });
            await context.route('**/api/feedback', (route) => route.abort('blockedbyclient'));
            const page = await context.newPage();
            await page.goto(process.env.BASE_URL + '/explore', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(900);
            const body = await page.locator('body').innerText();
            const facts = {
              url: page.url(),
              title: await page.title(),
              hasExploratoryDisclosure: body.includes('EXPLORATORY LAYOUT'),
              hasRankDriver: body.includes('RANKED BY FOR YOU'),
              hasOldSemanticAxis: body.includes('SEMANTIC DISTANCE'),
              hasOldPressureAxis: body.includes('SIGNAL PRESSURE'),
              hasScopedSearch: body.includes('SEARCH THIS SCAN'),
              statsText: await page.locator('.explore-field-stats').innerText().catch(() => null),
            };
            if (!facts.hasExploratoryDisclosure || !facts.hasRankDriver || facts.hasOldSemanticAxis || facts.hasOldPressureAxis || !facts.hasScopedSearch) {
              throw new Error('Gate 14A preview integrity contract failed: ' + JSON.stringify(facts));
            }
            const out = path.join(process.env.GITHUB_WORKSPACE, 'artifacts/gate-14a');
            await page.screenshot({ path: path.join(out, 'explore-desktop.png'), fullPage: true });
            fs.writeFileSync(path.join(out, 'facts.json'), JSON.stringify(facts, null, 2));
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-14a-explore-preview
          path: artifacts/gate-14a
          if-no-files-found: error
          retention-days: 7
