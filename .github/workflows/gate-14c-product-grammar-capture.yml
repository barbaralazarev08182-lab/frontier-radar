name: Gate 14C Product Grammar Capture

on:
  push:
    branches:
      - agent/strict-design-audit-capture

jobs:
  capture-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Gate 14C branch
        uses: actions/checkout@v4
        with:
          ref: agent/gate-14c-product-grammar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app and browser tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Build fixture-mode app
        run: npm run build
        env:
          FRONTIER_DATA_MODE: fixture
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: ""

      - name: Start app
        shell: bash
        run: |
          FRONTIER_DATA_MODE=fixture NEXT_TELEMETRY_DISABLED=1 npm run start > /tmp/frontier-g14c.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/today > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/frontier-g14c.log
          exit 1

      - name: Capture desktop surfaces
        shell: bash
        run: |
          mkdir -p artifacts/gate-14c
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, reducedMotion: 'reduce' });
            await context.route('**/api/feedback', (route) => route.abort('blockedbyclient'));
            const page = await context.newPage();
            const out = path.join(process.cwd(), 'artifacts/gate-14c');
            const report = [];

            async function capture(name, route, fullPage = true) {
              await page.goto('http://127.0.0.1:3000' + route, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(500);
              const nav = await page.locator('.fr-site-nav').evaluate((el) => {
                const rect = el.getBoundingClientRect();
                const style = getComputedStyle(el);
                return {
                  x: Math.round(rect.x), y: Math.round(rect.y), width: Math.round(rect.width), height: Math.round(rect.height),
                  position: style.position, background: style.backgroundColor, color: style.color,
                  tone: el.getAttribute('data-fr-tone'),
                };
              });
              const brandVisible = await page.locator('.fr-brand__label').isVisible();
              const links = await page.locator('.fr-primary-nav__link').allTextContents();
              const viewportWidth = await page.evaluate(() => window.innerWidth);
              const documentWidth = await page.evaluate(() => document.documentElement.scrollWidth);
              const entry = { name, route, nav, brandVisible, links, viewportWidth, documentWidth };
              report.push(entry);
              await page.screenshot({ path: path.join(out, `${name}.png`), fullPage });
              return entry;
            }

            await capture('01-today', '/today', false);
            await capture('02-explore', '/explore');

            const projectHref = await page.locator('a[href^="/project/"]').first().getAttribute('href').catch(() => null);
            if (projectHref) await capture('03-project-route-check', projectHref);

            await capture('04-saved', '/saved');
            await capture('05-idea-lab', '/idea-lab');

            fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2));

            for (const entry of report) {
              if (!entry.brandVisible) throw new Error(`Brand hidden on ${entry.name}`);
              if (entry.documentWidth > entry.viewportWidth + 1) throw new Error(`Horizontal overflow on ${entry.name}`);
              if (entry.nav.x !== 0 || entry.nav.y !== 0) throw new Error(`Nav origin mismatch on ${entry.name}`);
              if (entry.nav.height !== 48) throw new Error(`Nav height mismatch on ${entry.name}: ${entry.nav.height}`);
              if (entry.nav.width < entry.viewportWidth - 20 || entry.nav.width > entry.viewportWidth + 1) {
                throw new Error(`Nav viewport fit mismatch on ${entry.name}: ${entry.nav.width} vs ${entry.viewportWidth}`);
              }
            }

            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-14c-product-grammar-desktop
          path: artifacts/gate-14c
          if-no-files-found: warn
          retention-days: 7

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/frontier-g14c.log || true
